services:
  # 1. FastAPI Backend
  - type: web
    name: api-service
    env: docker
    dockerfilePath: ./Dockerfile.backend
    dockerCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-scheduler-db
          property: connectionString

  # 2. Worker Process
  - type: worker
    name: worker-service
    env: docker
    dockerfilePath: ./Dockerfile.backend
    dockerCommand: "cd worker && python main.py"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-scheduler-db
          property: connectionString

  # 3. Dispatcher Process
  - type: worker
    name: dispatcher-service
    env: docker
    dockerfilePath: ./Dockerfile.backend
    dockerCommand: "cd worker && python dispatcher.py"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-scheduler-db
          property: connectionString

  # 4. React Frontend (Vite)
  - type: web
    name: frontend-dashboard
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: api-service
          property: host

databases:
  # PostgreSQL Database
  - name: job-scheduler-db
    plan: free
    databaseName: job_scheduler
    user: user
